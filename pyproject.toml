[project]
name = "autonomous-traders"
version = "0.1.0"
description = "A multi-agent trading simulation in which four LLM-driven traders manage their own portfolios, research the market through MCP tools, and rewrite their own strategies based on real performance."
readme = "README.md"
authors = [
    { name = "Nikita28007" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "massive>=2.9.1",
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
autonomous-traders = "autonomous_traders:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]